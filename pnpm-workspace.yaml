packages:
  - "apps/*"
  - "packages/*"
  - "!**/test/**"
  - "!**/fixtures/**"
  - "!**/temp/**"
  - "!packages/tests/temp/**"

minimumReleaseAge: 2880
# TODO: remove once cn@0.2.2 (published 2026-09-01) is older than the 48h
# minimumReleaseAge window.
# TODO: remove once @tanstack/react-table@9.0.0 (published 2026-08-04) is older
# than the 48h minimumReleaseAge window.
minimumReleaseAgeExclude:
  - "cn"
  - "@tanstack/react-table"
  - "@tanstack/table-core"
  - "@tanstack/react-store"
  - "@tanstack/store"
overrides:
  'brace-expansion@1.1.22': '2.1.7' # lockwright: GHSA-3jxr-9vmj-r5cp, GHSA-6j4f-fj2g-mc7p, GHSA-f886-m6hf-6m8v, GHSA-mh99-v99m-4gvg, GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, GHSA-rgw5-rvv9-x895
