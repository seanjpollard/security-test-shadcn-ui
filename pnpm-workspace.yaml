packages:
  - "apps/*"
  - "packages/*"
  - "!**/test/**"
  - "!**/fixtures/**"
  - "!**/temp/**"
  - "!packages/tests/temp/**"

minimumReleaseAge: 2880
# TODO: remove once cn@0.2.2 (published 2026-09-01) is older than the 48h
# minimumReleaseAge window.
# TODO: remove once @tanstack/react-table@9.0.0 (published 2026-08-04) is older
# than the 48h minimumReleaseAge window.
minimumReleaseAgeExclude:
  - "cn"
  - "@tanstack/react-table"
  - "@tanstack/table-core"
  - "@tanstack/react-store"
  - "@tanstack/store"
overrides:
  'js-yaml@3.15.2': '4.3.2' # lockwright: GHSA-2883-xcg3-v3hh, GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-h67p-54hq-rp68, GHSA-mh29-5h37-fv8m
